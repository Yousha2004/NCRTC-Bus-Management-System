services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ncrtc_db
    environment:
      POSTGRES_USER: ncrtc_user
      POSTGRES_PASSWORD: ncrtc_password
      POSTGRES_DB: ncrtc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ncrtc_backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://ncrtc_user:ncrtc_password@db/ncrtc_db
      SECRET_KEY: supersecretkey
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ncrtc_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; the default value is %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local time
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc files to be created
# with logging configuration.
# sourceless = false

# search path for migration scripts
# prepend_sys_path = .

# version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, separate them with spaces
# version_locations = %(here)s/bar %(here)s/bat migrations/versions

# the placeholder "sqlalchemy.url" will be used by the
# script when generating the migration files.
sqlalchemy.url = postgresql://ncrtc_user:ncrtc_password@localhost/ncrtc_db


[post_write_hooks]
# post_write_hooks allows scripts to be run after generating a revision
# file.  By default, no hooks are configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
